<section data-anchor="call-to" class="call-to">
    <div class="call-to__company company">Confi<br />guru</div>
    <ul class="call-to__decorations decorations">
        <li data-parallax="reverse" class="decorations__ring decorations__ring--small decorations__ring--green"></li>
        <li data-parallax class="decorations__ring decorations__ring--middle decorations__ring--blue"></li>
        <li data-parallax class="decorations__ring decorations__ring--big decorations__ring--green"></li>
        <li data-parallax class="decorations__ring decorations__ring--large"></li>
        <li data-parallax="reverse" class="decorations__point decorations__point--green"></li>
    </ul>
    <div class="container">
        <div class="call-to__body">
            <div class="call-to__content">
                <h2 class="call-to__title title"><span class="title__circle title__circle--green"></span> We look forward to you!</h2>
                <div class="call-to__form form">
                    <div class="form__body">
                        <div class="form__item">
                            <input class="input" name="name" type="text" placeholder="Your Name" />
                        </div>
                        <div class="form__item">
                            <input class="input" name="country" type="text" placeholder="Your Country" />
                        </div>
                        <div class="form__item">
                            <input class="input" name="email" type="email" placeholder="Your E-mail" />
                        </div>
                        <div class="form__item">
                            <input class="input" name="phone" type="tel" placeholder="Your Phone" />
                        </div>
                        <div class="form__item form__item--textarea">
                            <textarea class="textarea" name="message" placeholder="Your Message"></textarea>
                        </div>
                    </div>
                    <div class="form__bottom">
                        <div class="form__privacy">
                            <div class="form__privacy-checkbox checkbox">
                                <input id="privacy" checked class="checkbox__element" name="privacy" type="checkbox" />
                                <label for="privacy" class="checkbox__label"> </label>
                            </div>
                            <div class="form__privacy-text">I agree to the processing of personal data and agree to the <a href="#">privacy policy</a></div>
                        </div>
                        <button class="form__btn btn btn--green">Сontact us</button>
                    </div>
                </div>
            </div>
            <div class="call-to__right">
                <div class="call-to__circle decoration-circle decoration-circle--green"></div>
                <div class="call-to__anteater">
                    <img src="@img/immobiliar/call-to/anteater.svg" alt title />
                </div>
                <div class="call-to__dialog">
                    <div class="call-to__dialog-icon">
                        <img src="@img/immobiliar/call-to/list.png" alt title />
                    </div>
                    <b class="call-to__dialog-title"> Сontact us </b>
                    <p class="call-to__dialog-text">We will answer all your questions</p>
                </div>
            </div>
        </div>
    </div>
</section>
