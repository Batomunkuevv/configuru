<section data-anchor="why-we" class="render">
    <div data-scroll="horisontal" class="render__slide">
        <div class="render__block">
            <div class="container">
                <ul class="render__decorations decorations">
                    <li data-parallax="reverse" class="decorations__ring decorations__ring--small decorations__ring--light-orange"></li>
                    <li data-parallax="reverse" class="decorations__ring decorations__ring--middle decorations__ring--blue"></li>
                    <li data-parallax class="decorations__ring decorations__ring--big decorations__ring--blue"></li>
                    <li data-parallax class="decorations__ring decorations__ring--large decorations__ring--blue"></li>
                    <li data-parallax class="decorations__point"></li>
                    <li class="decorations__circle"></li>
                    <li class="decorations__circle decorations__circle--big"></li>
                </ul>
                <div class="render__body">
                    <h2>Static renderings is the technology of the past. Interactive 3D dynamic scenes is what makes your real estate object unique, and eventually helps you close the sell!</h2>
                </div>
            </div>
        </div>
    </div>
    <div data-scroll="horisontal" class="render__slide">
        <div class="render__block">
            <div class="container">
                <ul class="render__decorations decorations">
                    <li data-parallax="reverse" class="decorations__ring decorations__ring--small decorations__ring--light-orange"></li>
                    <li data-parallax="reverse" class="decorations__ring decorations__ring--middle decorations__ring--blue"></li>
                    <li data-parallax class="decorations__ring decorations__ring--big decorations__ring--blue"></li>
                    <li data-parallax class="decorations__ring decorations__ring--large decorations__ring--blue"></li>
                    <li data-parallax class="decorations__point"></li>
                    <li class="decorations__circle"></li>
                    <li class="decorations__circle decorations__circle--big"></li>
                </ul>
                <div class="render__body">
                    <h2>Static renderings</h2>
                    <div class="render__ipad ipad">
                        <div class="ipad__frame">
                            <img class="ipad__item" src="@img/immobiliar/render/staticVSdynamic.png" alt title />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div data-scroll="horisontal" class="render__slide">
        <div class="render__block">
            <div class="container">
                <ul class="render__decorations decorations">
                    <li data-parallax="reverse" class="decorations__ring decorations__ring--small decorations__ring--light-orange"></li>
                    <li data-parallax="reverse" class="decorations__ring decorations__ring--middle decorations__ring--blue"></li>
                    <li data-parallax class="decorations__ring decorations__ring--big decorations__ring--blue"></li>
                    <li data-parallax class="decorations__ring decorations__ring--large decorations__ring--blue"></li>
                    <li data-parallax class="decorations__point"></li>
                    <li class="decorations__circle"></li>
                    <li class="decorations__circle decorations__circle--big"></li>
                </ul>
                <div class="render__body">
                    <h2>3D dynamic scenes</h2>
                    <div class="render__ipad ipad">
                        <div class="ipad__frame ipad__frame--video is-paused">
                            <div class="ipad__btn">
                                <img src="@img/icons/btn-play.svg" alt title />
                            </div>
                            <video class="ipad__item" loop>
                                <source src="files/videos/staticVSdynamic.mp4" type="video/mp4" />
                            </video>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
