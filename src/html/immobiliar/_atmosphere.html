<section data-anchor="atmosphere" class="atmosphere">
    <div class="atmosphere__hand">
        <img src="@img/immobiliar/atmosphere/hand.svg" alt title />
    </div>
    <ul class="atmosphere__decorations decorations">
        <li data-parallax="reverse" class="decorations__ring decorations__ring--small decorations__ring--light-orange"></li>
        <li data-parallax="reverse" class="decorations__ring decorations__ring--middle decorations__ring--blue"></li>
        <li data-parallax class="decorations__ring decorations__ring--big decorations__ring--light-orange"></li>
        <li data-parallax class="decorations__ring decorations__ring--large"></li>
        <li data-parallax="" class="decorations__point decorations__point--green"></li>
    </ul>
    <div class="container">
        <div class="atmosphere__body">
            <div class="atmosphere__content">
                <h2 class="atmosphere__title title">
                    <span class="title__circle title__circle--green"></span>
                    Live atmosphere” brings emotions to the scene
                </h2>
                <p>
                    Static renderings don’t allow to live the beauty of the moment. Our “live atmosphere” feature does! Experience your future flat in different settings – in the “romantic dark” or
                    during “beautiful sunshine”
                </p>
            </div>
            <div class="atmosphere__video ipad">
                <div class="atmosphere__circle decoration-circle"></div>
                <div class="ipad__frame ipad__frame--video">
                    <div class="ipad__btn">
                        <img src="@img/icons/btn-play.svg" alt title />
                    </div>
                    <video class="ipad__item" loop>
                        <source src="files/videos/atmosphere.mp4" type="video/mp4;" />
                    </video>
                </div>
            </div>
        </div>
    </div>
</section>
