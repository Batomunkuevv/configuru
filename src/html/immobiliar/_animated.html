<section data-anchor="animated" class="animated simple-block simple-block--violet">
    <div class="animated__hand">
        <img src="@img/immobiliar/animated/hand.svg" title alt />
    </div>
    <ul class="simple-block__decorations decorations">
        <li data-parallax="reverse" class="decorations__ring decorations__ring--small decorations__ring--light-orange"></li>
        <li data-parallax="reverse" class="decorations__ring decorations__ring--middle decorations__ring--blue"></li>
        <li data-parallax class="decorations__ring decorations__ring--big decorations__ring--light-orange"></li>
        <li data-parallax class="decorations__ring decorations__ring--large"></li>
        <li data-parallax class="decorations__point decorations__point--green"></li>
    </ul>
    <div class="container">
        <div class="simple-block__body">
            <div class="simple-block__video">
                <div class="animated__circle simple-block__circle decoration-circle decoration-circle--violet"></div>
                <div class="simple-block__ipad ipad">
                    <div class="ipad__frame ipad__frame--video is-paused">
                        <div class="ipad__btn">
                            <img src="@img/icons/btn-play.svg" alt title />
                        </div>
                        <video class="ipad__item" loop>
                            <source src="files/videos/animated.mp4" type="video/mp4" />
                        </video>
                    </div>
                </div>
            </div>
            <div class="simple-block__content">
                <h2 class="simple-block__title simple-block__title--reverse title"><span class="title__circle title__circle--violet"></span> Animated scenes guarantee high customer involvement!</h2>
                <p>
                    Static renderings don’t allow to live the beauty of the moment. Our “live atmosphere” feature does! Experience your future flat in different settings – in the “romantic dark” or
                    during “beautiful sunshine”
                </p>
            </div>
        </div>
    </div>
</section>
